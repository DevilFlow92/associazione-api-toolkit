[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "associazione-api-toolkit"
version = "0.2.0"
description = "Shared Python toolkit for the associazione-api ecosystem"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DevilFlow92" }]
requires-python = ">=3.12"
keywords = ["fastapi", "toolkit", "http-client", "logging", "pagination"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/DevilFlow92/associazione-api-toolkit"
Repository = "https://github.com/DevilFlow92/associazione-api-toolkit"
Issues = "https://github.com/DevilFlow92/associazione-api-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/associazione_toolkit"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/associazione_toolkit --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/associazione_toolkit"]
omit = ["tests/*"]
